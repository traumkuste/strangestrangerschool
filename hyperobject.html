<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハイパーオブジェクト研究学科 — 観測票の保管室</title>
<style>
  :root{
    --bg:#12111A; --bg2:#1E1C2A; --ink:#CCC8DC; --dim:#7E7A92;
    --accent:#A898CC; --line:rgba(200,195,228,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    line-height:1.9; letter-spacing:.04em; overflow-x:hidden}
  #myc{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
       animation:mycdrift 90s ease-in-out infinite alternate}
  @keyframes mycdrift{from{transform:translate(-10px,-6px) scale(1.03)}to{transform:translate(10px,8px) scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ #myc{animation:none} }

  main{position:relative; z-index:1; max-width:680px; margin:0 auto; padding:6vh 20px 12vh}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.66rem;
    letter-spacing:.3em; color:var(--dim); text-transform:uppercase; margin-bottom:1rem}
  .eyebrow a{color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--dim)}
  h1{font-size:clamp(1.3rem,5vw,1.8rem); font-weight:600; letter-spacing:.1em; margin-bottom:.3rem}
  .sub{font-size:.84rem; color:var(--dim); font-style:italic; margin-bottom:1.4rem}
  .creed{font-size:.88rem; border-left:1px solid var(--line); padding-left:1em;
    color:var(--dim); margin-bottom:.6rem; line-height:2.1}
  h2{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.64rem; letter-spacing:.28em;
    color:var(--dim); font-weight:400; border-bottom:1px solid var(--line);
    padding-bottom:.5rem; margin:2.4rem 0 1rem}

  /* ---- フィルター ---- */
  #filters{display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.4rem}
  #filters button{font-family:ui-monospace,Menlo,monospace; font-size:.66rem; letter-spacing:.16em;
    background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:2em;
    padding:.38em 1em; cursor:pointer; transition:color .3s,border-color .3s}
  #filters button:hover,#filters button:focus-visible{color:var(--ink); border-color:var(--dim); outline:none}
  #filters button.active{color:var(--accent); border-color:var(--accent)}

  /* ---- 観測票カード ---- */
  #cards{display:flex; flex-direction:column; gap:1.1rem}
  .hyp-card{border:1px solid var(--line); border-radius:3px; padding:1rem 1.1rem .9rem}
  .hyp-card .hc-obj{font-size:1.05rem; font-weight:600; letter-spacing:.06em; margin-bottom:.5rem}
  .hyp-card dl{font-size:.84rem}
  .hyp-card dt{font-family:ui-monospace,Menlo,monospace; font-size:.58rem;
    letter-spacing:.22em; color:var(--dim); margin-top:.55rem}
  .hyp-card dd{margin-left:0; line-height:1.9}
  .hyp-card .hc-miss{margin-top:.7rem; border-left:1px solid var(--accent);
    padding:.15em 0 .15em .8em; font-size:.84rem; color:var(--dim); font-style:italic; line-height:2}
  .hyp-card time{font-family:ui-monospace,Menlo,monospace; font-size:.58rem;
    letter-spacing:.18em; color:var(--dim); display:block; margin-top:.7rem}
  .hyp-card .del-btn{float:right; font-family:ui-monospace,Menlo,monospace; font-size:.58rem;
    letter-spacing:.14em; background:none; border:none; color:var(--dim); cursor:pointer;
    padding:0; border-bottom:1px dotted transparent; transition:color .3s,border-color .3s}
  .hyp-card .del-btn:hover{color:#B88; border-color:#B88}

  .emptymsg{color:var(--dim); font-size:.86rem; padding:1.2em .2em; line-height:2.2}

  /* ---- 保管室フッター ---- */
  .status{font-family:ui-monospace,Menlo,monospace; font-size:.68rem; color:var(--dim);
    letter-spacing:.1em; line-height:2.2; margin-top:2rem}
  .status button{font-family:inherit; font-size:inherit; letter-spacing:inherit;
    background:none; border:none; color:var(--accent); cursor:pointer;
    border-bottom:1px dotted var(--accent); padding:0; margin-right:1.2em}
  footer{font-size:.72rem; color:var(--dim); border-top:1px solid var(--line);
    margin-top:2.5rem; padding-top:1.3rem; line-height:2.1}
</style>
</head>
<body>
<canvas id="myc" aria-hidden="true"></canvas>
<main>
  <p class="eyebrow"><a href="index.html">← 校門</a>　Strange Stranger School</p>
  <h1>ハイパーオブジェクト研究学科</h1>
  <p class="sub">観測票の保管室 — you can never see the whole thing.</p>
  <p class="creed">ハイパーオブジェクトは全体として現れません。私たちが手にできるのは断片だけです。<br>この部屋には、見えた断片と、見えなかった部分が、同等に保管されています。</p>

  <h2>観測票 / OBSERVATION TICKETS　<span id="count"></span></h2>
  <div id="filters"></div>
  <div id="cards"></div>

  <div class="status">
    <button id="b-export">記録を書き出す</button>
    <button id="b-import">読み込む</button>
    <input type="file" id="f-import" accept="application/json" hidden>
    <br><span id="storeinfo"></span>
  </div>

  <footer>観測票に書かれた「見えなかった部分」は欠落ではありません。<br>ハイパーオブジェクトの輪郭が、そこだけ少し透けて見えます。</footer>
</main>

<script>
/* ====== 菌糸メッシュ ====== */
(function(){
  const cv=document.getElementById('myc'), ctx=cv.getContext('2d');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H; const ws=[]; const MAX=22;
  const RGB='160,148,200';
  function size(){const d=Math.min(window.devicePixelRatio||1,1.5);
    W=cv.width=Math.floor(innerWidth*d); H=cv.height=Math.floor(innerHeight*d);}
  size(); addEventListener('resize',size);
  function reset(w){w.x=Math.random()*W; w.y=Math.random()*H;
    w.a=Math.random()*6.283; w.life=240+Math.random()*420;}
  function spawn(x,y,a){if(ws.length>=MAX)return;
    const w={}; reset(w); if(x!==undefined){w.x=x;w.y=y;w.a=a;} ws.push(w);}
  for(let i=0;i<10;i++)spawn();
  function step(){
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,0.045)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    for(const w of ws){
      const nx=w.x+Math.cos(w.a)*1.3, ny=w.y+Math.sin(w.a)*1.3;
      ctx.strokeStyle='rgba('+RGB+',0.48)'; ctx.lineWidth=0.65;
      ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(nx,ny); ctx.stroke();
      w.x=nx; w.y=ny; w.a+=(Math.random()-0.5)*0.52; w.life--;
      if(Math.random()<0.011){
        ctx.fillStyle='rgba('+RGB+',0.55)';
        ctx.beginPath(); ctx.arc(w.x,w.y,1.0,0,6.3); ctx.fill();
        spawn(w.x,w.y,w.a+(Math.random()<.5?1:-1)*0.9);
      }
      if(w.life<=0||w.x<-9||w.x>W+9||w.y<-9||w.y>H+9) reset(w);
    }
  }
  if(reduced){for(let i=0;i<600;i++)step();}
  else{(function loop(){step(); requestAnimationFrame(loop);})();}
})();

/* ====== 保管室 ====== */
const KEY='sss-hyp';
const mem={};
async function loadAll(){
  try{ if(window.storage){ const r=await window.storage.get(KEY);
    if(r&&r.value) return {data:JSON.parse(r.value),mode:'cloud'}; return {data:[],mode:'cloud'}; } }catch(e){}
  try{ const v=localStorage.getItem(KEY);
    return {data:v?JSON.parse(v):[],mode:'local'}; }catch(e){}
  return {data:mem[KEY]||[],mode:'memory'};
}
async function saveAll(data){
  const s=JSON.stringify(data);
  try{ if(window.storage){ await window.storage.set(KEY,s); return 'cloud'; } }catch(e){}
  try{ localStorage.setItem(KEY,s); return 'local'; }catch(e){}
  mem[KEY]=data; return 'memory';
}
function modeText(m){
  return {cloud:'記録先: 学校の保管室',local:'記録先: この端末',memory:'記録先: このページ限り'}[m];
}

const $=id=>document.getElementById(id);
let items=[], filterObj=null;

function allObjs(){
  const s=new Set(items.map(x=>x.obj).filter(Boolean));
  return [...s];
}
function renderFilters(){
  const box=$('filters'); box.innerHTML='';
  const all=document.createElement('button');
  all.textContent='すべて'; all.className=filterObj===null?'active':'';
  all.addEventListener('click',()=>{ filterObj=null; renderFilters(); renderCards(); });
  box.appendChild(all);
  for(const obj of allObjs()){
    const b=document.createElement('button');
    b.textContent=obj; b.className=filterObj===obj?'active':'';
    b.addEventListener('click',()=>{ filterObj=obj; renderFilters(); renderCards(); });
    box.appendChild(b);
  }
}
function renderCards(){
  const box=$('cards'); box.innerHTML='';
  const shown=filterObj?items.filter(x=>x.obj===filterObj):[...items];
  shown.reverse();
  $('count').textContent=shown.length+'件';
  if(!shown.length){
    const p=document.createElement('p'); p.className='emptymsg';
    p.textContent='観測票がありません。校門から記録できます。';
    box.appendChild(p); return;
  }
  for(const it of shown){
    const card=document.createElement('div'); card.className='hyp-card';
    const del=document.createElement('button'); del.className='del-btn'; del.textContent='手放す';
    del.addEventListener('click',async()=>{
      items=items.filter(x=>x.id!==it.id);
      await saveAll(items); renderFilters(); renderCards();
    });
    card.appendChild(del);
    const obj=document.createElement('div'); obj.className='hc-obj'; obj.textContent=it.obj||'名称未設定の観測';
    card.appendChild(obj);
    const dl=document.createElement('dl');
    const rows=[['今日見えた断片',it.frag],['どこで出会ったか / 手触り',it.where],['関連しそうな別の出来事',it.rel]];
    for(const [k,v] of rows){
      if(!v) continue;
      const dt=document.createElement('dt'); dt.textContent=k;
      const dd=document.createElement('dd'); dd.textContent=v;
      dl.appendChild(dt); dl.appendChild(dd);
    }
    card.appendChild(dl);
    if(it.miss){
      const miss=document.createElement('div'); miss.className='hc-miss';
      miss.textContent='見えなかった部分: '+it.miss;
      card.appendChild(miss);
    }
    const t=document.createElement('time'); t.textContent='観測日 '+(it.date||'—');
    card.appendChild(t);
    box.appendChild(card);
  }
}

$('b-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='sss-hyperobject.json'; a.click();
  URL.revokeObjectURL(a.href);
});
$('b-import').addEventListener('click',()=>$('f-import').click());
$('f-import').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const arr=JSON.parse(rd.result);
      if(Array.isArray(arr)){ items=arr; filterObj=null;
        await saveAll(items); renderFilters(); renderCards(); }
    }catch(err){ $('storeinfo').textContent='読み込めませんでした。'; }
  };
  rd.readAsText(f);
});

(async function init(){
  const {data,mode}=await loadAll();
  items=data;
  $('storeinfo').textContent=modeText(mode)+'　/　票数: '+items.length;
  renderFilters(); renderCards();
})();
</script>
</body>
</html>
